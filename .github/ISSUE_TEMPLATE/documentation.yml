name: Documentation issue
description: Report unclear, missing, contradictory, or outdated documentation.
title: "[Docs] "
labels:
  - documentation
body:
  - type: input
    id: location
    attributes:
      label: Document or section
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
