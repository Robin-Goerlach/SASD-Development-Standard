name: SASD Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sasd-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Validate (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Run repository quality gates
        env:
          PYTHONUTF8: "1"
        run: >-
          python tooling/run-quality-gates.py
          --output-dir artifacts/quality-gates/${{ runner.os }}

      - name: Upload quality-gate evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sasd-quality-gates-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/quality-gates/${{ runner.os }}
          if-no-files-found: error
          retention-days: 14

  merge-gate:
    name: SASD merge gate
    if: ${{ always() }}
    needs:
      - validation
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Confirm all validation jobs passed
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
        run: |
          if [ "$VALIDATION_RESULT" != "success" ]; then
            echo "Repository validation did not complete successfully: $VALIDATION_RESULT"
            exit 1
          fi
          echo "All SASD repository validation jobs passed."
