name: Build and test

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskhost-local-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-audit:
    name: Windows build, tests and package audit
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Display .NET information
        run: dotnet --info

      - name: Restore
        run: dotnet restore TaskHostLocal.sln

      - name: Build
        run: dotnet build TaskHostLocal.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test TaskHostLocal.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=taskhost-local-tests.trx"
          --collect "XPlat Code Coverage"
          --results-directory TestResults

      - name: Audit NuGet packages
        run: dotnet list TaskHostLocal.sln package --vulnerable --include-transitive

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskhost-local-test-results
          path: TestResults
          if-no-files-found: warn
          retention-days: 14
