name: Build, test and verify

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskhost-local-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows Wave 01 verification
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Execute repository verification
        shell: powershell
        run: >-
          .\scripts\verify-wave-01.ps1
          -Configuration Release
          -EvidenceRoot .\verification-results\ci

      - name: Publish verification summary
        if: always()
        shell: powershell
        run: |
          $summary = '.\verification-results\ci\verification-summary.md'
          if (Test-Path $summary) {
            Get-Content $summary | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          else {
            '# Verification summary was not generated' | Add-Content $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: taskhost-local-wave-01-evidence-${{ github.sha }}
          path: verification-results/ci
          if-no-files-found: error
          retention-days: 30
